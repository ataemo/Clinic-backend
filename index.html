<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>ຫລັງບ້ານ - Clinic Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --primary:#0f766e;
  --accent:#c9a227;
  --bg:#f6f8f9;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e6e9ec;
  --radius:16px;
  --shadow:0 8px 24px rgba(15,23,42,.06);
  --danger:#e11d48;
  --success:#16a34a;
  --warn:#d97706;
}
[data-theme="dark"]{
  --bg:#0b1220;
  --surface:#131c2e;
  --text:#e8edf3;
  --muted:#94a3b8;
  --border:#233047;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Noto Sans Lao','Inter',sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

/* ===== CONFIG / CONNECTION BANNER ===== */
.cfg-banner{background:#fef3c7;color:#92400e;font-size:12.5px;padding:12px 20px;display:none;align-items:center;gap:10px;position:sticky;top:0;z-index:500;}
.cfg-banner.show{display:flex;}
.cfg-banner button{margin-left:auto;background:#92400e;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11.5px;cursor:pointer;flex-shrink:0;}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),#0b3d3a 60%, #052a27);padding:20px;}
.login-card{background:var(--surface);width:100%;max-width:400px;border-radius:24px;padding:40px 32px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.login-logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;color:#fff;}
.login-card h1{font-size:20px;margin:0 0 4px;}
.login-card p{color:var(--muted);font-size:13px;margin:0 0 24px;}
.field{text-align:left;margin-bottom:14px;}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s, opacity .15s;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:linear-gradient(135deg,var(--primary),#115e59);color:#fff;width:100%;}
.btn-gold{background:linear-gradient(135deg,var(--accent),#a5811a);color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:10px;}
.error-msg{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}
.demo-hint{margin-top:18px;font-size:11px;color:var(--muted);background:var(--bg);padding:10px;border-radius:10px;}

/* ===== APP LAYOUT ===== */
.app{display:none;min-height:100vh;}
.app.active{display:flex;}
.sidebar{width:250px;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:40;transition:transform .25s;}
.sidebar-header{padding:20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.sidebar-header .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;overflow:hidden;}
.sidebar-header .logo img{width:100%;height:100%;object-fit:cover;}
.sidebar-header b{font-size:14px;display:block;}
.sidebar-header span{font-size:11px;color:var(--muted);}
.nav-group{padding:10px 10px 0;}
.nav-group-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 12px 6px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--text);cursor:pointer;margin-bottom:2px;font-weight:500;}
.nav-item i{width:18px;text-align:center;color:var(--muted);}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:linear-gradient(135deg,var(--primary),#115e59);color:#fff;}
.nav-item.active i{color:#fff;}

.main{margin-left:250px;flex:1;min-height:100vh;padding-bottom:80px;}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.topbar h2{font-size:17px;margin:0;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);position:relative;}
.icon-btn:hover{background:var(--bg);}
.badge-dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);}
.menu-toggle{display:none;}
.content{padding:20px 22px;}

.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a5811a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;}

/* ===== CARDS / GRID ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-card .icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;}
.stat-card .val{font-size:24px;font-weight:800;margin-top:10px;}
.stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:2px;}

.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px;}
.card-title{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}
.section-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
@media(max-width:900px){.section-grid{grid-template-columns:1fr;}}

.quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.quick-btn{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;cursor:pointer;flex:1;min-width:90px;box-shadow:var(--shadow);}
.quick-btn i{font-size:18px;color:var(--primary);}
.quick-btn:hover{transform:translateY(-2px);transition:.15s;}

/* ===== TABLE ===== */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:hover td{background:var(--bg);}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.chip-green{background:#dcfce7;color:#166534;}
.chip-yellow{background:#fef3c7;color:#92400e;}
.chip-red{background:#fee2e2;color:#991b1b;}
.chip-blue{background:#dbeafe;color:#1e40af;}
.chip-gray{background:#e5e7eb;color:#374151;}
[data-theme="dark"] .chip-green{background:#052e1b;color:#4ade80;}
[data-theme="dark"] .chip-yellow{background:#3a2a05;color:#fbbf24;}
[data-theme="dark"] .chip-red{background:#3a0d15;color:#fb7185;}
[data-theme="dark"] .chip-blue{background:#0b2a4a;color:#7dd3fc;}
[data-theme="dark"] .chip-gray{background:#1e293b;color:#cbd5e1;}

/* ===== TAB ROW (ໃຊ້ໃນໜ້າ ຈັດການໜ້າຮ້ານ) ===== */
.tab-row{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;margin-bottom:16px;padding-bottom:4px;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
.tab-row::-webkit-scrollbar{height:4px;}
.tab-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:12px;background:var(--surface);border:1.5px solid var(--border);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s;}
.tab-btn i{font-size:13px;}
.tab-btn:hover{border-color:var(--primary);color:var(--primary);}
.tab-btn.active{background:linear-gradient(135deg,var(--primary),#115e59);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(15,118,110,.3);}
.tab-row-wrap{display:flex;align-items:center;gap:6px;margin-bottom:16px;}
.tab-row-wrap .tab-row{margin-bottom:0;flex:1;}
.tab-scroll-btn{display:none;flex-shrink:0;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}
.tab-scroll-btn:hover{background:var(--bg);color:var(--primary);}
@media(min-width:641px){ .tab-scroll-btn{display:flex;} }
.tab-btn.active i{color:#fff;}
@media(max-width:640px){
  .tab-row{gap:6px;}
  .tab-btn{padding:9px 13px;font-size:12px;}
}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px;}
.search-box input{width:100%;padding:10px 12px 10px 36px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border-radius:20px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-header h3{margin:0;font-size:17px;}
.modal-close{cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* ===== BOTTOM NAV (mobile) ===== */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:50;padding:6px 4px;justify-content:space-around;}
.bottom-nav .bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--muted);padding:6px 4px;cursor:pointer;font-weight:600;}
.bottom-nav .bn-item.active{color:var(--primary);}
.bottom-nav .bn-item i{font-size:17px;}

/* Toast */
.toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:12px;padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:10px;min-width:220px;animation:slideIn .2s;}
@keyframes slideIn{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast i{font-size:16px;}
.toast.success i{color:var(--success);}
.toast.error i{color:var(--danger);}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state i{font-size:32px;margin-bottom:10px;display:block;}

.loading-spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.boot-spin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),#0b3d3a 60%, #052a27);color:#fff;flex-direction:column;gap:14px;}
.boot-spin .loading-spin{width:32px;height:32px;border-width:3px;}

.timeline{border-left:2px solid var(--border);margin-left:8px;padding-left:20px;}
.timeline-item{position:relative;padding-bottom:20px;}
.timeline-item::before{content:'';position:absolute;left:-26px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--surface);}
.timeline-item .t-date{font-size:11px;color:var(--muted);}
.timeline-item .t-label{font-size:13.5px;font-weight:600;margin-top:2px;}

.color-swatch{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);cursor:pointer;padding:0;}

@media(max-width:860px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;padding-bottom:90px;}
  .menu-toggle{display:flex;}
  .bottom-nav{display:flex;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<!-- ============ CORS / CONFIG WARNING BANNER ============ -->
<div class="cfg-banner" id="cfgBanner">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <span id="cfgBannerText">ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ API URL</span>
  <button onclick="location.reload()">ລອງໃໝ່</button>
</div>

<!-- ============ BOOT SCREEN (ລໍຖ້າກວດສອບ session) ============ -->
<div class="boot-spin" id="bootScreen">
  <span class="loading-spin"></span>
  <span style="font-size:13px;opacity:.85;">ກຳລັງເຊື່ອມຕໍ່ລະບົບ...</span>
</div>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginScreen" style="display:none;">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-spa"></i></div>
    <h1 id="loginTitle">ຄລີນິກຄວາມງາມ</h1>
    <p>Clinic & Aesthetic Management System</p>
    <div class="field">
      <label>ຊື່ຜູ້ໃຊ້ / Username</label>
      <input id="loginUser" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>ລະຫັດຜ່ານ / Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">ເຂົ້າສູ່ລະບົບ</button>
    <div class="error-msg" id="loginError"></div>
    <div class="demo-hint">Demo: <b>admin</b> / <b>admin123</b> (ປ່ຽນລະຫັດຫລັງເຂົ້າລະບົບ)</div>
    <div style="margin-top:14px;"><a onclick="goStorefront()" style="font-size:12.5px;color:var(--primary);font-weight:700;cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> ກັບໄປໜ້າຮ້ານ</a></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo" id="sbLogo"><i class="fa-solid fa-spa"></i></div>
      <div>
        <b id="sbClinicName">Clinic System</b>
        <span id="sbUserRole">-</span>
      </div>
    </div>
    <nav id="navContainer"></nav>
    <div style="height:20px;"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="topbar-actions">
        <select id="langSwitch" onchange="setLang(this.value)" class="btn-outline btn" style="padding:8px 10px;">
          <option value="lo">🇱🇦 ລາວ</option>
          <option value="th">🇹🇭 ไทย</option>
          <option value="en">🇬🇧 EN</option>
        </select>
        <button class="icon-btn" onclick="goStorefront()" title="ໜ້າຮ້ານ"><i class="fa-solid fa-store"></i></button>
        <button class="icon-btn" onclick="toggleDark()"><i class="fa-solid fa-circle-half-stroke" id="darkIcon"></i></button>
        <button class="icon-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
        <button class="icon-btn" onclick="openNotifPanel()"><i class="fa-solid fa-bell"></i><span class="badge-dot" id="notifDot" style="display:none;"></span></button>
        <div class="avatar" id="userAvatar" onclick="doLogout()" title="ອອກຈາກລະບົບ">A</div>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<!-- Bottom nav mobile -->
<div class="bottom-nav" id="bottomNav"></div>

<!-- Generic Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">Form</h3>
      <div class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* =====================================================================
 * ການຕັ້ງຄ່າ (CONFIG) — ແກ້ 2 ຄ່ານີ້ໃຫ້ຄືກັນກັບ Index.html ກ່ອນ deploy
 * ===================================================================== */

// URL ຂອງ Google Apps Script Web App (Deploy > New deployment > Web app), ຕ້ອງລົງທ້າຍດ້ວຍ /exec
var API_BASE_URL = 'https://script.google.com/macros/s/AKfycbxWrKs4LMPRMuEAhHOoBxfcEPCtb1QGvUkQc-OMquELd6IbK4BIG_qwM47admVvXu38/exec';

// URL ຂອງໜ້າຮ້ານ (Storefront / Index.html) ທີ່ deploy ຢູ່ GitHub Pages
var STOREFRONT_URL = 'https://yourname.github.io/clinic-storefront/';

/* =====================================================================
 * API CLIENT — fetch() + POST + Content-Type: text/plain (ຫຼີກລ່ຽງ CORS Preflight)
 * ===================================================================== */
function gasCall(action, args) {
  return fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // ຫ້າມໃຊ້ application/json
    body: JSON.stringify({ action: action, args: args || [], token: getToken() })
  })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' - ເຊື່ອມຕໍ່ Server ບໍ່ໄດ້');
      return res.json();
    })
    .then(function (json) {
      if (!json.success) {
        var err = new Error(json.message || 'API Error');
        err.code = json.code;
        throw err;
      }
      return json.data;
    });
}

function getToken() {
  try { return localStorage.getItem('clinic_token') || ''; } catch (e) { return ''; }
}
function setToken(tok) {
  try { localStorage.setItem('clinic_token', tok || ''); } catch (e) {}
}
function clearToken() {
  try { localStorage.removeItem('clinic_token'); } catch (e) {}
}

/* ---------------------------------------------------------------------
 * SHIM: ຈຳລອງ google.script.run.withSuccessHandler().withFailureHandler()
 * ໂຄ້ດທຸລະກິດຂ້າງລຸ່ມນີ້ (ຄືເກົ່າ 100%) ບໍ່ຕ້ອງແກ້ໄຂຫຍັງເລີຍ
 * ------------------------------------------------------------------- */
function createScriptRunner_() {
  var state = { success: null, failure: null };
  var proxy = new Proxy({}, {
    get: function (_target, prop) {
      if (prop === 'withSuccessHandler') return function (cb) { state.success = cb; return proxy; };
      if (prop === 'withFailureHandler') return function (cb) { state.failure = cb; return proxy; };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        gasCall(prop, args)
          .then(function (data) { if (state.success) state.success(data); })
          .catch(function (err) {
            // Session ໝົດອາຍຸ / Token ບໍ່ຖືກຕ້ອງ -> ບັງຄັບກັບໄປໜ້າ login
            if (err.code === 'UNAUTHORIZED') { forceReLogin_(err.message); return; }
            if (state.failure) state.failure(err); else console.error('GAS API error:', err);
          });
      };
    }
  });
  return proxy;
}

function doLogin(){
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  var btn = document.getElementById('loginBtn');
  document.getElementById('loginError').textContent = '';
  if (!u || !p) { document.getElementById('loginError').textContent = 'ກະລຸນາປ້ອນຊື່ຜູ້ໃຊ້ ແລະ ລະຫັດຜ່ານ'; return; }
  var originalHtml = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spin"></span>';
  google.script.run.withSuccessHandler(function(res){
    btn.disabled = false;
    btn.textContent = originalHtml;
    if (res.success) {
      STATE.user = res.user;
      setToken(res.token); // ເກັບ token ໄວ້ໃຊ້ເອີ້ນ API ອື່ນໆຕໍ່ໄປ
      try { localStorage.setItem('clinic_user', JSON.stringify(res.user)); } catch(e){}
      enterApp();
    } else {
      document.getElementById('loginError').textContent = res.message;
    }
  }).withFailureHandler(function(err){
    btn.disabled = false;
    btn.textContent = originalHtml;
    document.getElementById('loginError').textContent = 'ຜິດພາດ: ' + err.message;
  }).apiLogin(u, p);
}

  if (!confirm('ອອກຈາກລະບົບ?')) return;

}

/* ================= IMAGE RESIZE (ຫຍໍ້ຮູບກ່ອນອັບໂຫລດ) =================
 * ໃຊ້ canvas ຫຍໍ້ຮູບຝັ່ງ browser ກ່ອນສົ່ງຂຶ້ນ Drive - ປະຫຍັດພື້ນທີ່ ແລະ ໂຫລດໄວຂຶ້ນ
 * maxDim = ຂະໜາດດ້ານກວ້າງ/ສູງສຸດ (px), quality = ຄຸນນະພາບ JPEG (0-1) */
function resizeImageToBase64(file, maxDim, quality, callback){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        else { w = Math.round(w * (maxDim / h)); h = maxDim; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', quality || 0.85);
      callback(dataUrl.split(',')[1]); // base64 ບໍ່ມີ prefix
    };
    img.onerror = function(){ callback(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

function renderCrudPage(entity, columns, formFields, opts){
  opts = opts || {};

  container.innerHTML =
    '<div class="toolbar">'+
      '<div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="crudSearch" placeholder="'+t('search')+'" oninput="filterCrudTable()"></div>'+
      '<button class="btn btn-primary" onclick="openCrudForm(\''+entity+'\')"><i class="fa-solid fa-plus"></i> '+t('add')+'</button>'+
    '</div>'+
    '<div class="card"><div class="table-wrap"><table id="crudTable"><thead><tr>'+
      columns.map(function(c){return '<th>'+c.label+'</th>';}).join('')+
      '<th></th></tr></thead><tbody id="crudTbody"><tr><td colspan="'+(columns.length+1)+'" class="empty-state">Loading...</td></tr></tbody></table></div></div>';

  window.currentCrudEntity = entity;
  window.currentCrudColumns = columns;
  window.currentCrudFields = formFields;

  fetchList(entity, function (list){
    window.currentCrudData = list.filter(function(x){return x.Status!=='Deleted';}).reverse();
    renderCrudRows(window.currentCrudData);
  });
}

function renderCrudRows(list){
  var columns = window.currentCrudColumns;
  var tbody = document.getElementById('crudTbody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="'+(columns.length+1)+'" class="empty-state"><i class="fa-solid fa-inbox"></i>ບໍ່ມີຂໍ້ມູນ</td></tr>'; return; }
  tbody.innerHTML = list.map(function(row){
    var cells = columns.map(function(c){
      var v = row[c.key];
      if (c.type === 'status') v = statusChip(v);
      else if (c.type === 'money') v = fmtMoney(v);
      else if (c.type === 'date') v = fmtDate(v);
      else if (c.render) v = c.render(row);
      else v = v || '-';
      return '<td>'+v+'</td>';
    }).join('');
    return '<tr>'+cells+
      '<td><button class="btn btn-outline btn-sm" onclick=\'editCrudRow("'+row.Id+'")\'><i class="fa-solid fa-pen"></i></button> '+
      '<button class="btn btn-danger btn-sm" onclick="deleteCrudRow(\''+row.Id+'\')"><i class="fa-solid fa-trash"></i></button></td></tr>';
  }).join('');
}

function buildFormHtml(fields, data){
  data = data || {};
  return '<div class="form-grid">' + fields.map(function(f){
    var val = data[f.key] !== undefined ? data[f.key] : (f.default||'');
    var full = f.full ? ' full' : '';
    if (f.type === 'select') {
      var opts = (f.options||[]).map(function(o){
        var ov = typeof o === 'object' ? o.value : o;
        var ol = typeof o === 'object' ? o.label : o;
        return '<option value="'+ov+'" '+(String(val)===String(ov)?'selected':'')+'>'+ol+'</option>';
      }).join('');
      return '<div class="field'+full+'"><label>'+f.label+'</label><select id="f_'+f.key+'">'+opts+'</select></div>';
    }
    if (f.type === 'textarea') {
      return '<div class="field'+full+'"><label>'+f.label+'</label><textarea id="f_'+f.key+'" rows="3">'+(val||'')+'</textarea></div>';
    }
    if (f.type === 'image') {
      return '<div class="field'+full+'"><label>'+f.label+'</label>'+
        '<img id="imgprev_'+f.key+'" src="'+esc(val||'')+'" style="width:120px;height:90px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--bg);display:'+(val?'block':'none')+';" onerror="this.style.display=\'none\'">'+
        '<input id="f_'+f.key+'" type="text" value="'+esc(val)+'" placeholder="https://..." oninput="var im=document.getElementById(\'imgprev_'+f.key+'\');im.src=this.value;im.style.display=this.value?\'block\':\'none\';">'+
        '<input type="file" accept="image/*" style="margin-top:6px;" onchange="handleImageFieldUpload(this,\''+f.key+'\')">'+
        '<span id="upstat_'+f.key+'" style="font-size:11px;color:var(--muted);margin-top:4px;display:block;"></span></div>';
    }
    return '<div class="field'+full+'"><label>'+f.label+'</label><input id="f_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(val)+'"></div>';
  }).join('') + '</div>';
}

function handleImageFieldUpload(input, fieldKey){
  var file = input.files[0];
  if (!file) return;
  var status = document.getElementById('upstat_'+fieldKey);
  status.textContent = 'ກຳລັງຫຍໍ້ຮູບ...';
  resizeImageToBase64(file, 800, 0.85, function(base64){
    if (!base64) { status.textContent = 'ຜິດພາດ: ອ່ານຮູບບໍ່ໄດ້'; return; }
    status.textContent = 'ກຳລັງອັບໂຫລດ...';
    google.script.run.withSuccessHandler(function(res){
      document.getElementById('f_'+fieldKey).value = res.url;
      var im = document.getElementById('imgprev_'+fieldKey);
      im.src = res.url; im.style.display='block';
      status.textContent = 'ອັບໂຫລດສຳເລັດ ✓';
    }).withFailureHandler(function(e){
      status.innerHTML = '<span style="color:var(--danger);">⚠ ' + e.message + '</span>';
    }).apiUploadImage(base64, (file.name||'img')+'.jpg', 'image/jpeg');
  });
}

function openCrudForm(entity, existing){
  var fields = window.currentCrudFields;
  var body = buildFormHtml(fields, existing) +
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">'+t('cancel')+'</button>'+
    '<button class="btn btn-primary" onclick="submitCrudForm(\''+entity+'\',\''+(existing?existing.Id:'')+'\')">'+t('save')+'</button></div>';
  openModal((existing?t('edit'):t('add')), body);
}

function editCrudRow(id){
  var row = window.currentCrudData.find(function(x){return x.Id===id;});
  openCrudForm(window.currentCrudEntity, row);
}

function collectFormData(fields){
  var obj = {};
  fields.forEach(function(f){ obj[f.key] = document.getElementById('f_'+f.key).value; });
  return obj;
}

function submitCrudForm(entity, id){
  var fields = window.currentCrudFields;
  var data = collectFormData(fields);
  var handler = function(){
    closeModal(); invalidate(entity); toast('ບັນທຶກສຳເລັດ'); renderPage(STATE.currentPage);
  };
  var fail = function(e){ toast('ຜິດພາດ: '+e.message,'error'); };
  if (id) {
    google.script.run.withSuccessHandler(handler).withFailureHandler(fail).apiUpdate(entity, id, data, STATE.user.Id);
  } else {
    google.script.run.withSuccessHandler(handler).withFailureHandler(fail).apiCreate(entity, data, STATE.user.Id);
  }
}

function deleteCrudRow(id){
  if (!confirm('ຢືນຢັນການລຶບ?')) return;
  google.script.run.withSuccessHandler(function(){
    invalidate(window.currentCrudEntity); toast('ລຶບແລ້ວ'); renderPage(STATE.currentPage);
  }).withFailureHandler(function(e){ toast(e.message,'error'); }).apiDelete(window.currentCrudEntity, id, STATE.user.Id);
}

/* ================= TRACKING OVERVIEW CHART (Dashboard) ================= */
var _trkOverviewChartInstance = null;

function classifyDue_(createdAt, dueDate, defaultDays, isDoneFn, item){
  var created = new Date(createdAt);
  var due = dueDate ? new Date(dueDate) : new Date(created.getTime()+defaultDays*86400000);
  if (isDoneFn(item)) return 'done';
  return due < new Date() ? 'overdue' : 'upcoming';
}

function renderTrkOverviewChart(){
  var totals = {upcoming:0, done:0, overdue:0};

  fetchList('Appointments', function(list){
    list.forEach(function(a){
      var due = a.Date ? new Date(a.Date+'T'+(a.Time||'00:00')) : null;
      var cat = (a.Status==='Completed'||a.Status==='Cancelled') ? 'done' : (due && due<new Date() ? 'overdue' : 'upcoming');
      totals[cat]++;
    });
    drawTrkOverview_(totals);
  }, true);

  fetchList('Prescriptions', function(list){
    list.filter(function(p){return p.Status!=='Cancelled';}).forEach(function(p){
      var cat = classifyDue_(p.CreatedAt, p.DueDate, 3, function(x){return x.Status==='Dispensed';}, p);
      totals[cat]++;
    });
    drawTrkOverview_(totals);
  }, true);

  fetchList('Invoices', function(list){
    list.filter(function(x){return x.Status!=='Deleted';}).forEach(function(iv){
      var cat = classifyDue_(iv.CreatedAt, iv.DueDate, 7, function(x){return Number(x.Balance)<=0;}, iv);
      totals[cat]++;
    });
    drawTrkOverview_(totals);
  }, true);

  fetchList('FollowUps', function(list){
    list.forEach(function(f){
      var cat = classifyDue_(f.CreatedAt, f.DueDate, 7, function(x){return x.Status==='Done'||x.Status==='Cancelled';}, f);
      totals[cat]++;
    });
    drawTrkOverview_(totals);
  }, true);
}

function drawTrkOverview_(totals){
  var canvas = document.getElementById('trkOverviewChart');
  var legend = document.getElementById('trkOverviewLegend');
  if (!canvas || !legend || typeof Chart === 'undefined') return;
  if (_trkOverviewChartInstance) { _trkOverviewChartInstance.destroy(); }

  var total = totals.upcoming + totals.done + totals.overdue;
  legend.innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="width:10px;height:10px;border-radius:3px;background:#0f766e;display:inline-block;"></span> ທີ່ຈະຮອດ: <b>'+totals.upcoming+'</b></div>'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="width:10px;height:10px;border-radius:3px;background:#16a34a;display:inline-block;"></span> ສຳເລັດແລ້ວ: <b>'+totals.done+'</b></div>'+
    '<div style="display:flex;align-items:center;gap:8px;"><span style="width:10px;height:10px;border-radius:3px;background:#e11d48;display:inline-block;"></span> ເກີນກຳນົດ: <b>'+totals.overdue+'</b></div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:8px;">ລວມທັງໝົດ (ນັດໝາຍ + ໃບສັ່ງຢາ + ໃບບິນ + ຕິດຕາມຜົນ): <b>'+total+'</b> ລາຍການ</div>';

  if (!total) return;
  _trkOverviewChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: ['ທີ່ຈະຮອດ','ສຳເລັດແລ້ວ','ເກີນກຳນົດ'],
      datasets: [{ data: [totals.upcoming, totals.done, totals.overdue], backgroundColor: ['#0f766e','#16a34a','#e11d48'], borderWidth: 0 }]
    },
    options: { cutout:'65%', plugins:{legend:{display:false}}, maintainAspectRatio:false, animation:{duration:400} }
  });
}

    '</div>';

/* ==== Drag & Drop logic ==== */
function initCategoryDragDrop(){
  var grid = document.getElementById('catDragGrid');
  if (!grid) return;
  var dragEl = null;

  grid.querySelectorAll('.cat-drag-card').forEach(function(card){
    card.addEventListener('dragstart', function(){
      dragEl = card;
      setTimeout(function(){ card.style.opacity = '0.35'; }, 0);
    });
    card.addEventListener('dragend', function(){
      card.style.opacity = '1';
      dragEl = null;
      persistCategoryOrderFromDOM();
    });
    card.addEventListener('dragover', function(e){
      e.preventDefault();
      if (!dragEl || dragEl === card) return;
      card.style.background = 'var(--bg)';
    });
    card.addEventListener('dragleave', function(){
      card.style.background = '';
    });
    card.addEventListener('drop', function(e){
      e.preventDefault();
      card.style.background = '';
      if (!dragEl || dragEl === card) return;
      var allCards = Array.prototype.slice.call(grid.querySelectorAll('.cat-drag-card'));
      var fromIdx = allCards.indexOf(dragEl);
      var toIdx = allCards.indexOf(card);
      if (fromIdx < toIdx) card.after(dragEl); else card.before(dragEl);
    });
  });
}

function persistCategoryOrderFromDOM(){
  var grid = document.getElementById('catDragGrid');
  if (!grid) return;
  var newOrder = Array.prototype.slice.call(grid.querySelectorAll('.cat-drag-card')).map(function(card){
    return window.sfCats[Number(card.getAttribute('data-idx'))];
  });
  window.sfCats = newOrder;
  var updates = { category_master: JSON.stringify(newOrder) };
  google.script.run.withSuccessHandler(function(){
    Object.assign(STATE.settings, updates);
    toast('ບັນທຶກລຳດັບແລ້ວ');
    redrawCategoryList(); // ອັບເດດ data-idx ໃໝ່ໃຫ້ຖືກຕ້ອງ
  }).withFailureHandler(function(e){toast(e.message,'error'); redrawCategoryList();}).apiSetSettingsBulk(updates, STATE.user.Id);
}

function submitCategoryForm(existingName){
  var name = document.getElementById('catName').value.trim();
  var icon = document.getElementById('catIconUrl').value.trim();
  if (!name) { toast('ກະລຸນາປ້ອນຊື່ໝວດໝູ່','error'); return; }

  function saveIconThenClose(finalName){
    window.sfTempIcons[finalName] = icon;
    if (existingName && existingName !== finalName) delete window.sfTempIcons[existingName];
    var updates = {
      category_icons: JSON.stringify(window.sfTempIcons),
      category_master: JSON.stringify(window.sfCats)
    };
    google.script.run.withSuccessHandler(function(){
      Object.assign(STATE.settings, updates);
      closeModal(); toast('ບັນທຶກສຳເລັດ'); renderSfCategories();
    }).withFailureHandler(function(e){toast(e.message,'error');}).apiSetSettingsBulk(updates, STATE.user.Id);
  }

  if (!existingName) {
    google.script.run.withSuccessHandler(function(list){ window.sfCats = list; saveIconThenClose(name); })
      .withFailureHandler(function(e){toast(e.message,'error');}).apiCategoryAdd(name, STATE.user.Id);
  } else if (existingName !== name) {
    google.script.run.withSuccessHandler(function(list){ window.sfCats = list; saveIconThenClose(name); })
      .withFailureHandler(function(e){toast(e.message,'error');}).apiCategoryRename(existingName, name, STATE.user.Id);
  } else {
    saveIconThenClose(name);
  }
}

function deleteCategory(name){
  if (!confirm('ຢືນຢັນລຶບໝວດໝູ່ "'+name+'"?')) return;
  google.script.run.withSuccessHandler(function(){
    delete window.sfTempIcons[name];
    var iconsJson = JSON.stringify(window.sfTempIcons);
    google.script.run.withSuccessHandler(function(){ STATE.settings.category_icons = iconsJson; })
      .apiSetSetting('category_icons', iconsJson, STATE.user.Id);
    toast('ລຶບໝວດໝູ່ສຳເລັດ'); renderSfCategories();
  }).withFailureHandler(function(e){toast(e.message,'error');}).apiCategoryDelete(name, STATE.user.Id);
}

function moveCategory(i, dir){
  var arr = window.sfCats, j = i+dir;
  if (j<0||j>=arr.length) return;
  var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  var updates = { category_master: JSON.stringify(window.sfCats), category_order: JSON.stringify(window.sfCats) };
  google.script.run.withSuccessHandler(function(){ Object.assign(STATE.settings, updates); redrawCategoryList(); })
    .withFailureHandler(function(e){toast(e.message,'error');}).apiSetSettingsBulk(updates, STATE.user.Id);

function uploadConfirmIllust(input){
  var file = input.files[0]; if (!file) return;
  var status = document.getElementById('cfIllustStat');
  status.textContent = 'ກຳລັງຫຍໍ້ຮູບ...';
  resizeImageToBase64(file, 400, 0.85, function(base64){
    if (!base64) { status.textContent = 'ຜິດພາດ: ອ່ານຮູບບໍ່ໄດ້'; return; }
    status.textContent = 'ກຳລັງອັບໂຫລດ...';
    google.script.run.withSuccessHandler(function(res){
      document.getElementById('cfIllust').value = res.url;
      var im = document.getElementById('cfIllustPrev'); im.src = res.url; im.style.display='block';
      status.textContent = 'ອັບໂຫລດສຳເລັດ ✓';
    }).withFailureHandler(function(e){
      status.innerHTML = '<span style="color:var(--danger);">⚠ ' + e.message + '</span>';
    }).apiUploadImage(base64, (file.name||'confirm')+'.jpg', 'image/jpeg');
  });
}
function saveConfirmCardSettings(){
  var updates = {
    confirm_icon: document.getElementById('cfIcon').value.trim() || 'fa-calendar-check',
    confirm_title: document.getElementById('cfTitle').value.trim(),
    confirm_subtitle: document.getElementById('cfSubtitle').value.trim(),
    confirm_illustration: document.getElementById('cfIllust').value.trim(),
    confirm_footer_title: document.getElementById('cfFootTitle').value.trim(),
    confirm_footer_text: document.getElementById('cfFootText').value.trim()
  };
  google.script.run.withSuccessHandler(function(){
    Object.assign(STATE.settings, updates);
    toast('ບັນທຶກສຳເລັດ');
  }).withFailureHandler(function(e){ toast(e.message,'error'); }).apiSetSettingsBulk(updates, STATE.user.Id);
}

/* ---- ແທັບ 4: ບໍລິການແນະນຳ (ໃໝ່: ຮູບ + ຈັດລຳດັບ + ແກ້ໄຂ) ---- */
function renderSfFeatured(){
  fetchList('Services', function(services){
    var body = document.getElementById('sfBody');
    var active = services.filter(function(s){return s.Status!=='Deleted';});
    if (!active.length) { body.innerHTML = '<div class="empty-state">ຍັງບໍ່ມີບໍລິການ (ໄປເພີ່ມໃນໜ້າ "ບໍລິການ" ກ່ອນ)</div>'; return; }

    var featOrder = [];
    try { featOrder = JSON.parse(STATE.settings.featured_order || '[]'); } catch(e){ featOrder = []; }
    var featured = active.filter(function(s){ return String(s.Featured).toLowerCase()==='true'; });
    featured.sort(function(a,b){ return featOrder.indexOf(a.Id) - featOrder.indexOf(b.Id); });
    window.sfFeatured = featured;
    window.sfAllServices = active;

    body.innerHTML =
      '<div class="card"><div class="card-title">ບໍລິການແນະນຳ (ລຳດັບການສະແດງຢູ່ໜ້າຮ້ານ)</div>'+
      '<div id="featList">'+renderFeaturedListHtml()+'</div></div>'+
      '<div class="card"><div class="card-title">ບໍລິການທັງໝົດ (ຕິກເພື່ອເພີ່ມ/ຖອນອອກຈາກແນະນຳ)</div>'+
      '<div class="table-wrap"><table><thead><tr><th></th><th>ຮູບ</th><th>ຊື່ບໍລິການ</th><th>ໝວດ</th><th>ລາຄາ</th></tr></thead><tbody>'+
      active.map(function(s){
        var checked = String(s.Featured).toLowerCase()==='true' ? 'checked' : '';
        var img = s.Image || 'https://placehold.co/60x60?text=No+Img';
        return '<tr><td><input type="checkbox" '+checked+' onchange="toggleFeatured(\''+s.Id+'\',this.checked)"></td>'+
          '<td><img src="'+img+'" style="width:44px;height:44px;object-fit:cover;border-radius:8px;" onerror="this.src=\'https://placehold.co/60x60?text=No+Img\'"></td>'+
          '<td>'+s.Name+'</td><td>'+(s.Category||'-')+'</td><td>'+fmtMoney(s.Price)+'</td></tr>';
      }).join('') + '</tbody></table></div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:10px;">ໝາຍເຫດ: ຖ້າບໍ່ໄດ້ຕິກເລືອກເລີຍ ລະບົບຈະສະແດງບໍລິການ 8 ລາຍການທຳອິດແທນອັດຕະໂນມັດ</div></div>';
  }, true);
}
function renderFeaturedListHtml(){
  var featured = window.sfFeatured || [];
  if (!featured.length) return '<div class="empty-state">ຍັງບໍ່ໄດ້ເລືອກບໍລິການແນະນຳ — ຕິກເລືອກຈາກຕາຕະລາງລຸ່ມນີ້</div>';
  return featured.map(function(s,i){
    var img = s.Image || 'https://placehold.co/80x60?text=No+Img';
    return '<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">'+
      '<img src="'+img+'" style="width:64px;height:48px;object-fit:cover;border-radius:8px;flex-shrink:0;" onerror="this.src=\'https://placehold.co/80x60?text=No+Img\'">'+
      '<div style="flex:1;min-width:0;"><b>'+s.Name+'</b><br><span style="font-size:11.5px;color:var(--muted);">'+(s.Category||'')+' • '+fmtMoney(s.Price)+'</span></div>'+
      '<div style="display:flex;gap:6px;flex-shrink:0;">'+
      (i>0?'<button class="btn btn-outline btn-sm" onclick="moveFeatured('+i+',-1)"><i class="fa-solid fa-arrow-up"></i></button>':'')+
      (i<featured.length-1?'<button class="btn btn-outline btn-sm" onclick="moveFeatured('+i+',1)"><i class="fa-solid fa-arrow-down"></i></button>':'')+
      '<button class="btn btn-outline btn-sm" onclick="editFeaturedService(\''+s.Id+'\')" title="ແກ້ໄຂ"><i class="fa-solid fa-pen"></i></button>'+
      '</div></div>';
  }).join('');
}
function moveFeatured(i, dir){
  var arr = window.sfFeatured, j = i+dir;
  if (j<0||j>=arr.length) return;
  var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  saveFeaturedOrder();
}
function saveFeaturedOrder(){
  var order = window.sfFeatured.map(function(s){ return s.Id; });
  google.script.run.withSuccessHandler(function(){
    STATE.settings.featured_order = JSON.stringify(order);
    var el = document.getElementById('featList');
    if (el) el.innerHTML = renderFeaturedListHtml();
    toast('ບັນທຶກລຳດັບແລ້ວ');
  }).withFailureHandler(function(e){toast(e.message,'error');}).apiSetSetting('featured_order', JSON.stringify(order), STATE.user.Id);
}
function toggleFeatured(id, val){
  google.script.run.withSuccessHandler(function(){
    invalidate('Services'); toast('ອັບເດດແລ້ວ'); renderSfFeatured();
  }).withFailureHandler(function(e){toast(e.message,'error');}).apiUpdate('Services', id, {Featured: val?'true':'false'}, STATE.user.Id);
}
function editFeaturedService(id){
  var svc = window.sfAllServices.find(function(x){ return x.Id===id; });
  getServiceFields(function(fields){
    window.currentCrudEntity = 'Services';
    window.currentCrudFields = fields;
    openCrudForm('Services', svc);
  });
}

    document.getElementById('medTbody').innerHTML = window.medData.length ? window.medData.map(function(m){

      var expSoon = m.Expiry && (new Date(m.Expiry)-new Date())/86400000 <= 30;
      return '<tr><td><b>'+m.GenericName+'</b><br><span style="font-size:11px;color:var(--muted);">'+(m.BrandName||'')+'</span></td><td>'+(m.Batch||'-')+'</td><td>'+(m.Expiry||'-')+(expSoon?' <span class="chip chip-yellow">ໃກ້ໝົດ</span>':'')+'</td>'+
        '<td>'+m.Stock+(low?' <span class="chip chip-red">ໜ້ອຍ</span>':'')+'</td><td>'+fmtMoney(m.SellPrice)+'</td><td>'+statusChip(m.Status)+'</td>'+
        '<td><button class="btn btn-outline btn-sm" onclick="openMedForm(\''+m.Id+'\')"><i class="fa-solid fa-pen"></i></button></td></tr>';
    }).join('') : '<tr><td colspan="7" class="empty-state">ບໍ່ມີຂໍ້ມູນຢາ</td></tr>';
  });

  fetchList('Prescriptions', function(pres){
    var pending = pres.filter(function(p){return p.Status==='Pending';});
    fetchList('Patients', function(patients){
      document.getElementById('dispenseArea').innerHTML = pending.length ? pending.map(function(p){
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;">'+

      }).join('') : '<div class="empty-state">ບໍ່ມີໃບສັ່ງຢາທີ່ຄ້າງຈ່າຍ</div>';
    });
  });
}
function openMedForm(id){
  var existing = id ? window.medData.find(function(x){return x.Id===id;}) : null;
  var fields = [
    {key:'GenericName',label:'ຊື່ຢາ (Generic)',full:true},{key:'BrandName',label:'ຊື່ການຄ້າ'},
    {key:'Category',label:'ໝວດໝູ່'},{key:'Unit',label:'ຫົວໜ່ວຍ'},{key:'Batch',label:'Batch No.'},
    {key:'Expiry',label:'ວັນໝົດອາຍຸ',type:'date'},{key:'Stock',label:'ຈຳນວນຄົງເຫຼືອ',type:'number'},
    {key:'MinStock',label:'ຈຳນວນຂັ້ນຕ່ຳ',type:'number'},{key:'CostPrice',label:'ລາຄາຕົ້ນທຶນ',type:'number'},
    {key:'SellPrice',label:'ລາຄາຂາຍ',type:'number'},{key:'Status',label:'ສະຖານະ',type:'select',options:['Active','Inactive'],default:'Active'}
  ];
  var body = buildFormHtml(fields, existing) + '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">'+t('cancel')+'</button><button class="btn btn-primary" onclick="saveMed(\''+(id||'')+'\')">'+t('save')+'</button></div>';
  window.medFields = fields;
  openModal(id?'ແກ້ໄຂຂໍ້ມູນຢາ':'ເພີ່ມຢາໃໝ່', body);
}
function saveMed(id){
  var data = collectFormData(window.medFields);
  var ok = function(){ closeModal(); invalidate('Medications'); toast('ບັນທຶກສຳເລັດ'); renderPharmacy(); };
  var fail = function(e){toast(e.message,'error');};
  if (id) google.script.run.withSuccessHandler(ok).withFailureHandler(fail).apiUpdate('Medications', id, data, STATE.user.Id);
  else google.script.run.withSuccessHandler(ok).withFailureHandler(fail).apiCreate('Medications', data, STATE.user.Id);
}

/* ================= CRM ================= */
function renderCRM(){
  fetchList('Patients', function(patients){
    fetchList('Invoices', function(invoices){
      var c = document.getElementById('pageContent');
      var segments = {New:0, Active:0, VIP:0, Inactive:0};
      var enriched = patients.filter(function(p){return p.Status!=='Deleted';}).map(function(p){
        var inv = invoices.filter(function(i){return i.PatientId===p.Id;});
        var total = inv.reduce(function(s,i){return s+Number(i.Paid||0);},0);
        var seg = total > 2000000 ? 'VIP' : (inv.length > 0 ? 'Active' : 'New');
        segments[seg] = (segments[seg]||0)+1;
        return {p:p, total:total, visits:inv.length, seg:seg};
      }).sort(function(a,b){return b.total-a.total;});

      c.innerHTML = '<div class="stat-grid">' + Object.keys(segments).map(function(k,i){
        var colors=['#0f766e','#2563eb','#c9a227','#e11d48'];
        return '<div class="stat-card"><div class="icon" style="background:'+colors[i]+';width:36px;height:36px;"><i class="fa-solid fa-user-group"></i></div><div class="val">'+segments[k]+'</div><div class="lbl">'+k+'</div></div>';
      }).join('') + '</div>'+
      '<div class="card"><div class="card-title">ລູກຄ້າຕາມມູນຄ່າ (Top Customers)</div><div class="table-wrap"><table><thead><tr><th>ຄົນເຈັບ</th><th>ຍອດຊື້ລວມ</th><th>ຈຳນວນຄັ້ງ</th><th>ກຸ່ມ</th></tr></thead><tbody>'+
        enriched.slice(0,30).map(function(e){
          var chipC = e.seg==='VIP'?'yellow':(e.seg==='Active'?'green':'blue');
          return '<tr><td>'+e.p.FullName+'</td><td>'+fmtMoney(e.total)+'</td><td>'+e.visits+'</td><td><span class="chip chip-'+chipC+'">'+e.seg+'</span></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    });
  });
}

function renderReports(){
  var c = document.getElementById('pageContent');
  c.innerHTML = '<div class="card"><div class="card-title">ລາຍງານລາຍຮັບ (Revenue Report)</div>'+
    '<div class="toolbar"><input type="date" id="repFrom"> <input type="date" id="repTo"> <button class="btn btn-primary btn-sm" onclick="loadRevReport()">ສະແດງ</button></div>'+
    '<div id="repChart"></div></div>'+
    '<div class="section-grid">'+
    '<div class="card"><div class="card-title">ບໍລິການຍອດນິຍົມ</div><div id="repServices"></div></div>'+
    '<div class="card"><div class="card-title">ສະຫຼຸບຄັງສິນຄ້າ</div><div id="repInventory"></div></div>'+
    '</div>';
  var today = new Date().toISOString().substring(0,10);
  var monthAgo = new Date(Date.now()-30*86400000).toISOString().substring(0,10);
  document.getElementById('repFrom').value = monthAgo;
  document.getElementById('repTo').value = today;
  loadRevReport();

  fetchList('Invoices', function(invoices){
    fetchList('Services', function(services){
      var items = {};
      invoices.forEach(function(inv){
        try {
          JSON.parse(inv.Items||'[]').forEach(function(it){ items[it.name] = (items[it.name]||0)+1; });
        } catch(e){}
      });
      var arr = Object.keys(items).map(function(k){return {name:k, count:items[k]};}).sort(function(a,b){return b.count-a.count;}).slice(0,8);
      document.getElementById('repServices').innerHTML = arr.length ? arr.map(function(a){
        return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>'+a.name+'</span><b>'+a.count+'</b></div>';
      }).join('') : '<div class="empty-state">ຍັງບໍ່ມີຂໍ້ມູນ</div>';
    });
  });
  fetchList('Medications', function(meds){
    var low = meds.filter(function(m){return Number(m.Stock)<=Number(m.MinStock||0);});
    document.getElementById('repInventory').innerHTML =
      '<div style="font-size:13px;margin-bottom:8px;">ຈຳນວນລາຍການທັງໝົດ: <b>'+meds.length+'</b></div>'+
      '<div style="font-size:13px;color:var(--danger);">ໃກ້ໝົດສາງ: <b>'+low.length+'</b> ລາຍການ</div>';
  });
}
function loadRevReport(){
  var from = document.getElementById('repFrom').value;
  var to = document.getElementById('repTo').value;
  google.script.run.withSuccessHandler(function(data){
    var max = Math.max.apply(null, data.map(function(d){return d.revenue;}).concat([1]));
    document.getElementById('repChart').innerHTML = data.length ? '<div style="display:flex;align-items:flex-end;gap:6px;height:160px;overflow-x:auto;">' +
      data.map(function(d){
        var h = Math.max(6,(d.revenue/max)*150);
        return '<div style="min-width:24px;text-align:center;"><div style="background:linear-gradient(180deg,var(--primary),var(--accent));height:'+h+'px;border-radius:4px 4px 0 0;" title="'+fmtMoney(d.revenue)+'"></div><div style="font-size:9px;color:var(--muted);margin-top:4px;">'+d.date.substring(5)+'</div></div>';
      }).join('') + '</div>' : '<div class="empty-state">ບໍ່ມີຂໍ້ມູນໃນຊ່ວງເວລານີ້</div>';
  }).apiRevenueReport(from, to);
}

/* override submitCrudForm for Users to hash password ຝັ່ງ server ແລະ ບໍ່ໃຫ້ overwrite hash ດ້ວຍຄ່າຫວ່າງ */
var _origSubmit = submitCrudForm;
submitCrudForm = function(entity, id){
  if (entity === 'Users') {
    var fields = window.currentCrudFields;
    var data = collectFormData(fields);
    if (!data.Password) delete data.Password; // ບໍ່ປ່ຽນລະຫັດຖ້າຊ່ອງນີ້ວ່າງ
    var handler = function(){ closeModal(); invalidate('Users'); toast('ບັນທຶກສຳເລັດ'); renderPage(STATE.currentPage); };
    var fail = function(e){ toast(e.message,'error'); };
    if (id) {
      google.script.run.withSuccessHandler(handler).withFailureHandler(fail).apiUpdateUser(id, data, STATE.user.Id);
    } else {
      google.script.run.withSuccessHandler(handler).withFailureHandler(fail).apiCreateUser(data);
    }
    return;
  }
  _origSubmit(entity, id);
};

    '<div class="field full"><label>ຄຳຂວັນ / Tagline</label><input id="setTagline" value="'+esc(s.clinic_tagline)+'"></div>'+
    '<div class="field full"><label>URL ໂລໂກ້ (Logo URL)</label><input id="setLogo" value="'+esc(s.logo_url)+'"></div>'+
    '<div class="field"><label>ສີຫຼັກ (Primary)</label><input id="setPrimary" type="color" value="'+(s.primary_color||'#0f766e')+'" class="color-swatch"></div>'+
    '<div class="field"><label>ສີຄຳ (Accent)</label><input id="setAccent" type="color" value="'+(s.accent_color||'#c9a227')+'" class="color-swatch"></div>'+
    '<div class="field"><label>ສະກຸນເງິນ</label><select id="setCurrency"><option value="LAK">LAK</option><option value="THB">THB</option><option value="USD">USD</option></select></div>'+
    '<div class="field"><label>ຄຳນຳໜ້າໃບບິນ</label><input id="setInvPrefix" value="'+esc(s.invoice_prefix)+'"></div>'+
    '<div class="field full"><label>ຂໍ້ຄວາມແລ່ນ (Marquee)</label><input id="setMarquee" value="'+esc(s.marquee_text)+'"></div>'+
    '<div class="field"><label>ເປີດໃຊ້ OTP ຢືນຢັນຕົວຕົນ (ໜ້າ "ຕິດຕາມ")</label><select id="setOtpEnabled"><option value="false">ປິດ</option><option value="true">ເປີດ</option></select></div>'+
    '<div class="field"><label>&nbsp;</label></div>'+
    '<div class="field full"><label>SMS Gateway URL (ຕົວຢ່າງ: https://sms-provider.com/send?to={phone}&msg={message}&key={apikey})</label><input id="setSmsUrl" value="'+esc(s.sms_api_url)+'"></div>'+
    '<div class="field full"><label>SMS API Key</label><input id="setSmsKey" value="'+esc(s.sms_api_key)+'"></div>'+
    '</div>'+
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">'+t('cancel')+'</button><button class="btn btn-primary" onclick="saveSettings()">'+t('save')+'</button></div>';
  openModal(t('settings'), body);
  setTimeout(function(){
    document.getElementById('setCurrency').value = s.currency||'LAK';
    document.getElementById('setOtpEnabled').value = s.otp_enabled==='true' ? 'true' : 'false';
  }, 50);
}
function saveSettings(){
  var updates = {
    clinic_name_la: document.getElementById('setClinicLa').value,
    clinic_name: document.getElementById('setClinicEn').value,
    clinic_tagline: document.getElementById('setTagline').value,
    logo_url: document.getElementById('setLogo').value,
    primary_color: document.getElementById('setPrimary').value,
    accent_color: document.getElementById('setAccent').value,
    currency: document.getElementById('setCurrency').value,
    invoice_prefix: document.getElementById('setInvPrefix').value,
    marquee_text: document.getElementById('setMarquee').value,
    otp_enabled: document.getElementById('setOtpEnabled').value,
    sms_api_url: document.getElementById('setSmsUrl').value,
    sms_api_key: document.getElementById('setSmsKey').value
  };
  google.script.run.withSuccessHandler(function(){
    closeModal(); loadSettings(); toast('ບັນທຶກການຕັ້ງຄ່າແລ້ວ');
  }).withFailureHandler(function(e){ toast('ຜິດພາດ: '+e.message,'error'); }).apiSetSettingsBulk(updates, STATE.user.Id);
}

function openNotifPanel(){
  openModal('ການແຈ້ງເຕືອນ', '<div class="empty-state"><i class="fa-solid fa-bell"></i>ບໍ່ມີການແຈ້ງເຕືອນໃໝ່</div>');
}
</script>
</body>
</html>
